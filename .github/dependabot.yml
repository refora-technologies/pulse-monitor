# Opens a pull request when something Pulse depends on has a newer version: its NuGet
# libraries and the GitHub Actions its workflows use. Each one goes through the checks like any
# other change, and nothing is merged without a person deciding to.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
