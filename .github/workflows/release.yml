# Builds a release when a version tag such as v1.3.4 is pushed, and leaves it as a DRAFT.
#
# It never publishes. Refora Technologies tests the drafted installer on real hardware first,
# then publishes by hand, as docs/RELEASING.md describes. Pulse's updater only ever sees
# published releases, so nothing reaches anyone until then.
#
# Everything it builds from is pinned: the exact Inno Setup and .NET SDK, and the two
# third-party programs Pulse ships, each checked against a SHA-256 before use. The installer
# gets a build provenance attestation, so anyone can check it was built here, from this tag:
#
#     gh attestation verify PulseSetup.exe --repo refora-technologies/pulse-monitor
name: Release build

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write       # to create the draft release
  id-token: write       # for the build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag, the version and the notes agree
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = ([xml](Get-Content Pulse.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne "v$version") { throw "The tag $tag does not match Pulse.csproj's version $version." }
          $setup = (Select-String -Path setup.iss -Pattern '^AppVersion=(.+)$').Matches[0].Groups[1].Value
          if ($setup -ne $version) { throw "setup.iss says $setup, Pulse.csproj says $version." }
          $notes = "release-notes/$version.md"
          if (-not (Test-Path $notes)) { throw "There are no release notes at $notes." }
          "VERSION=$version" >> $env:GITHUB_ENV
          "NOTES=$notes" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Inno Setup 6.7.3, checked
        shell: pwsh
        run: |
          $url  = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $hash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          Invoke-WebRequest $url -OutFile innosetup.exe
          $got = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $hash) { throw "Inno Setup downloaded with SHA-256 $got, not $hash." }
          Start-Process .\innosetup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /DIR=C:\InnoSetup6' -Wait
          if (-not (Test-Path C:\InnoSetup6\ISCC.exe)) { throw 'Inno Setup did not install.' }
          'INNO_ISCC=C:\InnoSetup6\ISCC.exe' >> $env:GITHUB_ENV

      - name: Run the checks, including these release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run.ps1 -Notes $env:NOTES

      - name: Build the installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      # Code signing goes here, once Pulse has a certificate. It must sign PulseSetup.exe before
      # the checksum and the attestation below are made, and build.ps1 writes the checksum, so
      # signing then means signing Pulse.exe before setup.iss runs. On hold until then.

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installer/PulseSetup.exe

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' --draft --verify-tag `
            --title "Pulse Monitor ${{ github.ref_name }}" --notes-file $env:NOTES `
            installer/PulseSetup.exe installer/PulseSetup.exe.sha256
